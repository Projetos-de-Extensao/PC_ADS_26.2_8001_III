---
repo_url: https://github.com/jonh-carvalho/PC_ADS_26.2_8001
site_author: Jonh Carvalho
site_name: PC_ADS_26.2_8001
copyright: Copyright ©️ 2026, Jonh Carvalho

nav: 
  - Home: index.md
  - Iniciação: 
      - Index: Iniciacao/index.md
      - Documento de Visão: Iniciacao/documento_de_visao.md
      #- Pesquisa: Iniciacao/pesquisa.md
      #- 5W2H: Iniciacao/5w2h.md
  - Elaboração:
      - Index: Elaboracao/index.md
      - casos de uso: Elaboracao/casos_de_uso.md
      - requisitos suplementares: Elaboracao/requisitos_suplementares.md
      - modelo de análise de segurança: Elaboracao/modelo_analise_seguranca.md
      - diagrama de classes: Elaboracao/diagrama_de_classes.md

  - Construção:
      - Index: Construcao/index.md
  - Transição:
      - Index: Transicao/index.md

  - Bibliografia: Disciplina/Bibliografia.md

extra_css:
  - css/extra.css

markdown_extensions:
  # Tooltips
  - abbr
  # Admonitions
  - admonition
  # Annotations, Buttons, Grids, Icons & Emojis, Images, Tooltips
  - attr_list
  # Footnotes
  - footnotes
  # Annotations, Grids, Images
  - md_in_html
  # Images
  - pymdownx.blocks.caption
  # Formatting
  - pymdownx.caret
  # Formatting
  - pymdownx.critic
  # Admonitions
  - pymdownx.details
  # Icons & Emojis
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji ''
      emoji_generator: !!python/name:material.extensions.emoji.to_svg ''
  # Code Blocks
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  # Code Blocks
  - pymdownx.inlinehilite
  # Formatting
  - pymdownx.keys
  # Formatting
  - pymdownx.mark
  # Code Blocks, Tooltips
  - pymdownx.snippets
  # Admonitions, Annotations, Code Blocks, Content Tabs
  - pymdownx.superfences
  # Content Tabs
  - pymdownx.tabbed:
      alternate_style: true
  # Lists
  - pymdownx.tasklist:
      custom_checkbox: true
  # Formatting
  - pymdownx.tilde
  # Data Tables

  - toc:
      permalink: true

plugins:
  - plantuml:
      puml_url: https://www.plantuml.com/plantuml/
      puml_keyword: plantuml
  - minify:
      minify_html: true
  - search
  - mkdocs-jupyter:
      execute: false
      allow_errors: true

theme:
  favicon: assets/ibmec_icon.png
  name: material
  logo: assets/ibmec_logo.png
  palette:
    
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: black
      toggle:
        icon: material/toggle-switch-off
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
      color_mode: dark
      language: pt-BR
      favicon: images/favicon.png
      user_color_mode_toggle: true
  
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github
    logo: simple/react
    favicon: simple/react
